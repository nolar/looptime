[build-system]
requires = ["setuptools", "setuptools-scm>=8.1"]
build-backend = "setuptools.build_meta"

[project]
name = "looptime"
description = "Fast-forward asyncio event loop time (in tests)"
keywords = ["asyncio", "event loop", "time", "python", "pytest"]
authors = [{name = "Sergey Vasilyev", email = "nolar@nolar.info"}]
maintainers = [{name = "Sergey Vasilyev", email = "nolar@nolar.info"}]
license = "MIT"
readme = "README.md"
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Framework :: AsyncIO",
    "Framework :: Pytest",
    "Framework :: aiohttp",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = [
]
dynamic = ["version"]  # taken from git tags

[project.urls]
homepage = "https://github.com/nolar/looptime"
repository = "https://github.com/nolar/looptime"
documentation = "https://github.com/nolar/looptime"

[project.entry-points.pytest11]
looptime_plugin = "looptime._internal.plugin"
looptime_timeproxies = "looptime._internal.timeproxies"
looptime_chronometers = "looptime._internal.chronometers"

[dependency-groups]
docs = [
    "sphinx>=9.0.0",
    "sphinx-llm>=0.1.4",
    "furo",
]
test = [
    "async-timeout",
    "codecov",
    "coverage",
    "coveralls",
    "pytest",
    "pytest-asyncio>=1.0.0",
    "pytest-cov",
    "pytest-mock",
]
lint = [
    {include-group = "test"},
    "mypy==2.3.1",
    "pre-commit",
    "isort",
]
dev = [
    {include-group = "docs"},
    {include-group = "lint"},
    {include-group = "test"},
]

[tool.setuptools_scm]
version_file = "looptime/_version.py"

[tool.uv]
exclude-newer = "7 days"
# MyPy is pinned, so the intent is explicit, no need for time constraints.
exclude-newer-package = { mypy=false }

[tool.mypy]
strict = true
packages = ["looptime"]
exclude = ['(^|/)test_.*\.py$']
python_version = "3.11"
exclude_gitignore = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest]
minversion = "9.0"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
log_format = "%(asctime)s %(levelname)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
addopts = ["--strict-markers"]

[tool.isort]
line_length = 120
multi_line_output = 11
balanced_wrapping = true
combine_as_imports = true
case_sensitive = true

name: Thorough tests
on:
  push:
    branches:
      - main
      - release/**
  schedule:
    - cron: "13 3 * * 6"
  workflow_dispatch: {}

jobs:
  linters:
    name: Linting and static analysis
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install --group dev --group lint -e .
      - run: pre-commit run --all-files
      - run: mypy

  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        # Assumption: if free-threaded works in one version, it works in all versions.
        python-version: [ "3.11", "3.12", "3.13", "3.14", "3.14t" ]
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - run: pip install --group dev -e .
      - run: pytest --color=yes --cov=looptime --cov-branch

      - name: Publish coverage to Coveralls.io
        if: success()
        run: coveralls --service=github
        env:
          GITHUB_TOKEN: ${{ secrets.github_token }}
        continue-on-error: true
      - name: Publish coverage to CodeCov.io
        uses: codecov/codecov-action@v3
        if: success()
        env:
          PYTHON: ${{ matrix.python-version }}
        with:
          flags: unit
          env_vars: PYTHON
        continue-on-error: true

  # No coverage: PyPy performs extremely poorly with tracing/coverage.
  pypy-tests:
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "pypy-3.11", "pypy-3.12" ]
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - run: pip install --group dev -e .
      - run: pytest --color=yes --no-cov

  coveralls-finish:
    name: Finalize coveralls.io
    needs: [unit-tests]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/setup-python@v7
      - run: pip install coveralls
      - run: coveralls --service=github --finish
        env:
          GITHUB_TOKEN: ${{ secrets.github_token }}
        continue-on-error: true
